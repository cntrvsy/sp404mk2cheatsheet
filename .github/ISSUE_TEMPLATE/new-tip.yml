name: Suggest an SP-404MKII Shortcut / Tip
description: Contribute a shortcut, button combo, or workflow tip to the cheat sheet
title: '[Tip]: '
labels: ['tip-submission']
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Sample Playback
        - Pattern Sequencer
        - Sample Edit & Chop
        - Pitch, Speed & Env
        - FX & Routing
        - Banks & Projects
        - Pad Modes (SHIFT + Pad)
    validations:
      required: true
  - type: input
    id: combo
    attributes:
      label: Button Combination
      description: 'What physical buttons do you press or hold?'
      placeholder: 'e.g. Hold REMAIN + BUS FX'
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: Action (What does it do?)
      placeholder: 'e.g. Swap Bus 1 and Bus 2 effects'
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Why / When is this useful? (Goal & Slang Aliases)
      placeholder: 'e.g. Quickly reverse the serial order of Bus 1 and Bus 2 effects without menu diving.'
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Verification Source (Manual Page, Firmware Note, or Community Reference)
      description: 'To prevent inaccurate tips, cite where this shortcut is documented or demonstrated.'
      placeholder: 'e.g. Roland Reference Manual v4.04 p. 82, C-Dub Cheat Sheet p. 9, or video timestamp'
    validations:
      required: true
  - type: checkboxes
    id: verified
    attributes:
      label: Hardware Verification
      options:
        - label: I have personally tested this exact button combination on physical SP-404MKII hardware.
          required: true
